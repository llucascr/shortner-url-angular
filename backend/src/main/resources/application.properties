spring.application.name=url-shortener
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:4200}

# Habilitar o console do H2 no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuração da conexão com o banco em memória (padrão)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração opcional do Hibernate/JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Rate Limit
resilience4j.ratelimiter.instances.url.limit-for-period=3
resilience4j.ratelimiter.instances.url.limit-refresh-period=30s
resilience4j.ratelimiter.instances.url.timeout-duration=0
