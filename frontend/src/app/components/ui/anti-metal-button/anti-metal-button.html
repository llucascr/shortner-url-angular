<span class="absolute inset-y-0 right-4 flex items-center text-base font-medium tracking-tight">
  <ng-content />
</span>
<span
  aria-hidden="true"
  class="accent absolute inset-y-1 left-1 z-10 flex w-11 items-center justify-start gap-2.5 overflow-hidden rounded-md pr-2.5 pl-3"
  [style.background]="'linear-gradient(180deg, ' + accentFrom() + ' 0%, ' + accentTo() + ' 100%)'"
>
  @for (index of chevrons; track index) {
    <svg
      width="18"
      height="20"
      viewBox="0 0 14 16"
      aria-hidden="true"
      focusable="false"
      class="shrink-0 overflow-visible"
    >
      <g [attr.fill]="dotColor()">
        @for (dot of dots; track $index) {
          <circle
            [attr.cx]="dot.cx"
            [attr.cy]="dot.cy"
            r="1"
            class="dot"
            [style.animation-delay.s]="index * 0.12 + dot.delay"
          />
        }
      </g>
    </svg>
  }
</span>
