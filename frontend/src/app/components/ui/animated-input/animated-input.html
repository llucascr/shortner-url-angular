<div
  class="orb-field flex h-13 min-w-0 items-center gap-2.5 rounded-xl border border-gray-300 bg-black py-2 pr-4 pl-2 shadow-lg transition-shadow duration-300 ease-out"
>
  <div class="orb size-8 shrink-0 overflow-hidden rounded-full" aria-hidden="true">
    @if (animate()) {
      <img
        src="https://cdn.21st.dev/assets/mirror/1e/1ea795ce563e99649f180625b9008f169bcf63bb1eaecce2c2e01ac1b8b5a09e.gif"
        alt=""
        width="32"
        height="32"
        class="size-full object-cover"
      />
    }
  </div>
  <div class="h-6 w-px shrink-0 bg-gray-600" aria-hidden="true"></div>
  <input
    #urlInput
    type="url"
    name="url"
    required
    aria-label="URL para encurtar"
    autocomplete="url"
    [placeholder]="placeholder()"
    class="min-w-0 flex-1 border-none bg-transparent text-base font-normal text-white outline-none placeholder:text-gray-400"
  />
</div>
