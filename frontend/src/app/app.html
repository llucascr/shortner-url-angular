<button
  class="theme-toggle"
  type="button"
  aria-label="Modo escuro"
  [attr.aria-pressed]="theme() === 'dark'"
  [attr.title]="theme() === 'dark' ? 'Mudar para tema claro' : 'Mudar para tema escuro'"
  (click)="toggleTheme()"
>
  @if (theme() === 'dark') {
    <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
    </svg>
  } @else {
    <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4" />
      <path
        d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"
      />
    </svg>
  }
</button>

<main class="grid min-h-svh place-items-center px-6 py-12">
  <div class="w-full max-w-2xl -translate-y-[8svh]">
    <app-input-url class="block"></app-input-url>
  </div>
</main>
